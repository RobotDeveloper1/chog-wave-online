<html>
  <head>

    <title>part preview</title>
    <style>
      html, body { margin: 0; background: #141021; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      .tag {
        position: fixed; transform: translate(-50%, 0); color: #f4f0ff;
        font: 600 13px/1.3 ui-monospace, monospace; text-shadow: 0 2px 6px #000;

      .tag small { display: block; color: #9d8fd0; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/partPreview.ts"></script>
